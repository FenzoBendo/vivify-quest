name: Build Test Map

# Builds the Vivify Quest test map (testmap/): the Unity project in
# testmap/unity generates every mesh, material and prefab from code and
# exports bundleWindows2021.vivify, a PC Vivify bundle like any map's; the
# Python tools write the chart, Info.dat (with the bundle's checksum) and the
# cover. The result is the VivifyTestMap artifact, which build.yml packs into
# the QMOD for Settings > Test Vivify.
#
# Unity needs a license. Add these repository secrets once (Settings >
# Secrets and variables > Actions); see testmap/README.md:
#   UNITY_LICENSE   the contents of your Unity_lic.ulf (Unity Personal is free)
#   UNITY_EMAIL     the Unity account's email
#   UNITY_PASSWORD  the Unity account's password
# Without them the run says so in its summary and stops; it does not fail.
#
# The song is never part of this: it is a commercial track, so players bring
# their own copy (testmap/README.md).

on:
  push:
    branches: [ main, master ]
    paths:
      - 'testmap/**'
      - '.github/workflows/build-test-map.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check the Unity license secrets are set
      id: license
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      run: |
        if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
          echo "ready=false" >> "$GITHUB_OUTPUT"
          {
            echo "### Test map not built: Unity license secrets are not set"
            echo "Add UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD as repository secrets (see testmap/README.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Test map skipped: add the Unity license secrets (testmap/README.md)"
        else
          echo "ready=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache the Unity Library folder
      if: steps.license.outputs.ready == 'true'
      uses: actions/cache@v4
      with:
        path: testmap/unity/Library
        key: testmap-library-${{ hashFiles('testmap/unity/Assets/**', 'testmap/unity/Packages/**', 'testmap/unity/ProjectSettings/**') }}
        restore-keys: testmap-library-

    - name: Build the bundle in Unity
      if: steps.license.outputs.ready == 'true'
      uses: game-ci/unity-builder@v4
      env:
        UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
        UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
      with:
        projectPath: testmap/unity
        unityVersion: 2021.3.16f1
        targetPlatform: StandaloneWindows64
        buildMethod: VivifyTestMap.BuildTestMap.BuildFromCommandLine
        versioning: None
        allowDirtyBuild: true

    - name: Write the chart, Info.dat and cover
      if: steps.license.outputs.ready == 'true'
      run: |
        sudo chown -R "$(id -u):$(id -g)" testmap/map
        test -s testmap/map/bundleWindows2021.vivify || { echo "::error::Unity produced no bundle"; exit 1; }
        python3 testmap/tools/make_map.py --windows2021-crc "$(cat testmap/map/bundle_crc.txt)"
        python3 testmap/tools/make_cover.py

    - name: Pack the map
      if: steps.license.outputs.ready == 'true'
      run: |
        cd testmap/map
        zip -9 ../../VivifyTestMap.zip Info.dat ExpertPlusStandard.dat bundleWindows2021.vivify cover.png
        cd ../..
        unzip -l VivifyTestMap.zip

    - name: Upload the map
      if: steps.license.outputs.ready == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: VivifyTestMap
        path: VivifyTestMap.zip
        retention-days: 90
