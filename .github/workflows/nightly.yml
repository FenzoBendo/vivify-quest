name: Nightly Release

# Builds the default branch once a day and publishes it as a single rolling
# pre-release tagged `nightly`, replacing the previous one. Skips the build when
# nothing has been committed since the last nightly. Run it by hand from the
# Actions tab to publish one now (tick `force` to rebuild an unchanged commit).
#
# The build is build.yml's (0.15.50), so a nightly carries what a release does:
# Vivify for Beat Saber 1.40.8 and 1.45.3, full and Lite, and the 1.45.3 ports
# (CustomJSONData, Tracks, Noodle Extensions, Chroma). The in-game updater picks
# the QMOD for the game version and build it is running.

on:
  schedule:
    - cron: '17 4 * * *'   # 04:17 UTC daily, off the top of the hour
  workflow_dispatch:
    inputs:
      force:
        description: 'Publish even if nothing changed since the last nightly'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check.outputs.build }}
      head: ${{ steps.check.outputs.head }}
      short: ${{ steps.check.outputs.short }}
      last: ${{ steps.check.outputs.last }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.repository.default_branch }}
        fetch-depth: 0

    - name: Anything new since the last nightly?
      id: check
      run: |
        head=$(git rev-parse HEAD)
        last=$(git rev-list -n 1 nightly 2>/dev/null || true)
        echo "head=$head" >> "$GITHUB_OUTPUT"
        echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        if [ "$head" = "$last" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
          echo "build=false" >> "$GITHUB_OUTPUT"
          echo "No commits since the last nightly ($last); nothing to publish." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "build=true" >> "$GITHUB_OUTPUT"
          echo "last=${last:-none}" >> "$GITHUB_OUTPUT"
        fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit

  # Published when the 1.40.8 build succeeded, even if the 1.45.3 one did not:
  # the release then simply has no -bs1.45.3 QMODs.
  publish:
    needs: [check, build]
    if: always() && needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ needs.check.outputs.head }}
        fetch-depth: 0

    - name: Download the QMODs
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    # Vivify's QMODs get the nightly in their names, keeping the "Lite" and
    # "-bs<game>" parts the updater chooses by:
    #   Vivify-v0.15.50.qmod           -> Vivify-v0.15.50-nightly.<date>.<sha>.qmod
    #   Vivify-v0.15.50-bs1.45.3.qmod  -> Vivify-v0.15.50-nightly.<date>.<sha>-bs1.45.3.qmod
    # The ports keep their names.
    - name: Name the nightly QMODs
      id: name
      run: |
        version=$(python3 -c "import json; print(json.load(open('mod.json'))['version'])")
        date=$(date -u +%Y%m%d)
        tag="nightly.${date}.${{ needs.check.outputs.short }}"
        mkdir -p out
        shopt -s nullglob
        for file in $(find artifacts -name '*.qmod'); do
          name=$(basename "$file")
          case "$name" in
            Vivify*) name="${name/v${version}/v${version}-${tag}}" ;;
          esac
          cp "$file" "out/$name"
        done
        ls -l out
        main="out/Vivify-v${version}-${tag}.qmod"
        if [ ! -f "$main" ]; then
          echo "::error::the 1.40.8 build produced no QMOD ($main); nothing is published"
          exit 1
        fi
        for want in "Vivify-Lite-v${version}-${tag}.qmod" "Vivify-v${version}-${tag}-bs1.45.3.qmod"; do
          [ -f "out/$want" ] || echo "::warning::$want is missing from this nightly"
        done
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "date=$date" >> "$GITHUB_OUTPUT"

    # One rolling release: the old one and its tag go, and the new one is
    # created at this commit, so the `nightly` tag always marks what was built.
    - name: Publish the nightly release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        last="${{ needs.check.outputs.last }}"
        if [ "$last" != "none" ] && [ -n "$last" ]; then
          changes=$(git log --no-merges --format='- %s (%h)' "$last..HEAD" | head -50)
        else
          changes=$(git log --no-merges --format='- %s (%h)' -20)
        fi
        cat > notes.md <<NOTES
        Automatic nightly build of \`${{ github.event.repository.default_branch }}\` at ${{ needs.check.outputs.short }}
        (Vivify ${{ steps.name.outputs.version }}, ${{ steps.name.outputs.date }}).

        Untested pre-release. For a stable build, use the latest numbered release.
        What changed in each version is in [CHANGELOG.md](../../blob/${{ needs.check.outputs.head }}/CHANGELOG.md).

        Downloads (install one Vivify QMOD; Vivify's in-game updater picks the right one itself):
        - **Vivify-v…-nightly….qmod**: Beat Saber 1.40.8, full build.
        - **Vivify-Lite-v…-nightly….qmod**: Beat Saber 1.40.8, Lite.
        - **…-bs1.45.3.qmod**: the same two for Beat Saber 1.45.3. The other QMODs (CustomJSONData,
          Tracks, Noodle Extensions, Chroma) are 1.45.3 ports Vivify needs there.

        ### Commits since the previous nightly
        ${changes:-- (none)}
        NOTES
        gh release delete nightly --yes --cleanup-tag || true
        gh release create nightly out/*.qmod \
          --target "${{ needs.check.outputs.head }}" \
          --title "Vivify nightly ${{ steps.name.outputs.date }} (${{ needs.check.outputs.short }})" \
          --notes-file notes.md \
          --prerelease
        echo "Published the \`nightly\` pre-release:" >> "$GITHUB_STEP_SUMMARY"
        ls out >> "$GITHUB_STEP_SUMMARY"
